<!--
  The email Supabase sends when a practitioner creates an account, in Spanish and
  in Hilo's colours instead of GoTrue's English default.

  The link points at `{{ .SiteURL }}/confirmar` with a **token hash**, not at
  `{{ .ConfirmationURL }}`. The difference matters: the token hash works when the
  email is opened on a phone and the account was created on a laptop, which is
  what actually happens. `{{ .ConfirmationURL }}` carries a PKCE code that can
  only be exchanged by the browser that started the sign-up.

  No clinical content is ever in an email — see src/server/notifications.ts.
-->
<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f5fb;padding:24px">
  <div style="max-width:520px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(30,36,54,.08)">
    <div style="background:linear-gradient(120deg,#6c4cf0,#8a5cf0);padding:20px 24px;color:#fff">
      <div style="font-weight:800;font-size:18px">Hilo</div>
      <div style="opacity:.9;font-size:13px;margin-top:2px">Confirmá tu cuenta</div>
    </div>
    <div style="padding:22px 24px;color:#20293a">
      <p style="margin:0 0 10px;font-size:14px;line-height:1.6">
        ¡Hola! Creaste una cuenta en Hilo. Tocá el botón y entrás derecho a tu espacio de trabajo.
      </p>
      <a href="{{ .SiteURL }}/confirmar?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/inicio"
         style="display:inline-block;margin-top:14px;background:#6c5ce7;color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:12px;font-size:14px">
        Confirmar mi cuenta
      </a>
      <p style="margin:16px 0 0;font-size:12.5px;line-height:1.6;color:#6b7280">
        El enlace vence en una hora. Si no fuiste vos, ignorá este correo: sin confirmar, la cuenta no se usa.
      </p>
    </div>
  </div>
  <div style="max-width:520px;margin:12px auto 0;text-align:center;color:#9aa0b4;font-size:11.5px">
    Hilo — tu trabajo clínico, ordenado.
  </div>
</div>
